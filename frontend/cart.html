<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Giỏ Hàng - WebPC</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    .cart-container { max-width: 1000px; margin: 2rem auto; padding: 0 1rem; }
    .cart-table { width: 100%; border-collapse: collapse; margin-bottom: 2rem; background: #fff; box-shadow: 0 2px 8px rgba(0,0,0,0.05); border-radius: 8px; overflow: hidden; }
    .cart-table th, .cart-table td { padding: 1rem; text-align: left; border-bottom: 1px solid #e5e7eb; }
    .cart-table th { background: var(--orange); color: #fff; font-weight: 600; }
    .cart-table tr:last-child td { border-bottom: none; }
    
    .cart-item-img { width: 60px; height: 60px; object-fit: cover; border-radius: 4px; vertical-align: middle; margin-right: 1rem; }
    .cart-item-name { display: inline-block; vertical-align: middle; font-weight: 600; color: var(--dark); max-width: 200px; }
    
    .qty-input { width: 60px; padding: 0.4rem; text-align: center; border: 1px solid #d1d5db; border-radius: 4px; }
    .btn-remove { background: #fee2e2; color: #dc2626; border: none; padding: 0.4rem 0.8rem; border-radius: 4px; cursor: pointer; font-size: 0.85rem; font-weight: 600; }
    .btn-remove:hover { background: #fecaca; }
    
    .cart-summary { background: #fff; padding: 1.5rem; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); text-align: right; }
    .cart-summary h3 { font-size: 1.3rem; margin-bottom: 1rem; color: var(--dark); }
    .cart-total-price { font-size: 1.6rem; color: var(--red); font-weight: 800; margin-left: 1rem; }
    
    .cart-actions { display: flex; justify-content: flex-end; gap: 1rem; margin-top: 1.5rem; }
    .btn-continue { background: #f3f4f6; color: var(--dark); padding: 0.8rem 1.5rem; border-radius: 6px; text-decoration: none; font-weight: 600; border: 1px solid #d1d5db; }
    .btn-continue:hover { background: #e5e7eb; }
    .btn-checkout { background: var(--red); color: #fff; padding: 0.8rem 1.5rem; border-radius: 6px; text-decoration: none; font-weight: 600; border: none; cursor: pointer; }
    .btn-checkout:hover { background: #b91c1c; }
    
    .empty-cart { text-align: center; padding: 4rem 1rem; background: #fff; border-radius: 8px; }
    .empty-cart h2 { color: #6b7280; margin-bottom: 1rem; }

    @media (max-width: 768px) {
      .cart-table thead { display: none; }
      .cart-table, .cart-table tbody, .cart-table tr, .cart-table td { display: block; width: 100%; }
      .cart-table tr { margin-bottom: 1rem; border: 1px solid #e5e7eb; border-radius: 8px; padding: 0.5rem; }
      .cart-table td { text-align: right; padding: 0.5rem; border: none; position: relative; }
      .cart-table td::before { content: attr(data-label); float: left; font-weight: 600; color: #4b5563; }
      .cart-item-name { max-width: 100%; display: block; margin-top: 0.5rem; text-align: right; }
      .cart-item-img { margin: 0; }
    }
  </style>
</head>
<body>
  <!-- Header -->
  <header class="site-header">
    <div class="logo">
      <a href="index.html" class="logo-link">
        <img src="logo.png" alt="Nam Nguyễn PC & Workstation Logo" class="logo-img">
        <div class="company-brand-text">
          <span class="company-title">NAM NGUYỄN</span>
          <span class="company-sub">PC & WORKSTATION</span>
        </div>
      </a>
    </div>
    <nav class="main-nav">
      <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="categories.html">Danh mục</a></li>
        <li><a href="products.html">Sản phẩm</a></li>
        <li><a href="promotions.html" class="promo-link-highlight">🔥 Khuyến Mãi</a></li>
        <li><a href="about.html">Giới thiệu</a></li>
        <li><a href="contact.html">Liên hệ</a></li>
        <li><a href="cart.html" class="active cart-link">🛒 Giỏ hàng (<span id="cart-count">0</span>)</a></li>
      </ul>
    </nav>
    <div class="search-wrap">
      <input type="text" placeholder="Tìm kiếm sản phẩm..." id="search-input" />
      <button id="search-btn">🔍</button>
    </div>
    <button class="menu-toggle" id="menu-toggle" aria-label="Toggle navigation">☰</button>
  </header>

  <main class="site-main">
    <div class="cart-container" id="cart-container">
      <h2 class="section-title">Giỏ hàng của bạn</h2>
      <div id="cart-content">
        <!-- Injected via JS -->
      </div>
    </div>
  </main>

  <footer class="site-footer">
    <p>© 2026 NAM NGUYỄN PC & WORKSTATION. All rights reserved.</p>
  </footer>

  <script src="cart.js"></script>
  <script src="auth-modal.js"></script>
  <script>
    function executeHeaderSearch() {
      const term = document.getElementById('search-input').value.trim();
      if (term) window.location = 'products.html?search=' + encodeURIComponent(term);
    }
    const searchBtn = document.getElementById('search-btn');
    const searchInput = document.getElementById('search-input');
    if (searchBtn) searchBtn.addEventListener('click', executeHeaderSearch);
    if (searchInput) searchInput.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') executeHeaderSearch();
    });

    function renderCart() {
      const cart = window.Cart.getCart();
      const container = document.getElementById('cart-content');
      
      if (cart.length === 0) {
        container.innerHTML = `
          <div class="empty-cart">
            <h2>Giỏ hàng đang trống</h2>
            <a href="categories.html" class="btn-continue">Tiếp tục mua sắm</a>
          </div>
        `;
        return;
      }

      let html = `
        <table class="cart-table">
          <thead>
            <tr>
              <th>Sản phẩm</th>
              <th>Đơn giá</th>
              <th>Số lượng</th>
              <th>Thành tiền</th>
              <th>Thao tác</th>
            </tr>
          </thead>
          <tbody>
      `;

      cart.forEach(item => {
        const subtotal = item.gia * item.quantity;
        html += `
          <tr>
            <td data-label="Sản phẩm">
              <a href="product_detail.html?id=${item.id}">
                <img src="${item.duong_dan_anh}" class="cart-item-img" alt="${item.ten_san_pham}">
                <span class="cart-item-name">${item.ten_san_pham}</span>
              </a>
            </td>
            <td data-label="Đơn giá">${Number(item.gia).toLocaleString('vi-VN')}₫</td>
            <td data-label="Số lượng">
              <input type="number" class="qty-input" value="${item.quantity}" min="1" data-id="${item.id}" onchange="changeQty(${item.id}, this.value)">
            </td>
            <td data-label="Thành tiền" style="color: var(--red); font-weight: 600;">${subtotal.toLocaleString('vi-VN')}₫</td>
            <td data-label="Thao tác">
              <button class="btn-remove" onclick="removeItem(${item.id})">Xóa</button>
            </td>
          </tr>
        `;
      });

      html += `
          </tbody>
        </table>
        
        <div class="cart-summary">
          <h3>Tổng cộng: <span class="cart-total-price">${window.Cart.getCartTotal().toLocaleString('vi-VN')}₫</span></h3>
          <div class="cart-actions">
            <a href="categories.html" class="btn-continue">Tiếp tục mua sắm</a>
            <button class="btn-checkout" onclick="window.location.href='checkout.html'">Tiến hành thanh toán</button>
          </div>
        </div>
      `;
      
      container.innerHTML = html;
    }

    // Handlers
    function changeQty(id, value) {
      const qty = parseInt(value, 10);
      if (qty >= 1) {
        window.Cart.updateQuantity(id, qty);
        renderCart();
      }
    }

    function removeItem(id) {
      if (confirm('Bạn có chắc muốn xóa sản phẩm này?')) {
        window.Cart.removeFromCart(id);
        renderCart();
      }
    }

    // Init – Guest Guard: yêu cầu đăng nhập để xem giỏ hàng
    document.addEventListener('DOMContentLoaded', () => {
      const token = localStorage.getItem('customer_token') || sessionStorage.getItem('customer_token');
      if (!token) {
        // Guest: hiện thông báo mời đăng nhập
        document.getElementById('cart-content').innerHTML = `
          <div class="empty-cart" id="guest-cart-notice">
            <div style="font-size:4rem; margin-bottom:1rem;">🔐</div>
            <h2 style="color:#374151; margin-bottom:0.75rem;">Vui lòng đăng nhập</h2>
            <p style="color:#6b7280; margin-bottom:1.5rem;">Bạn cần đăng nhập để xem và quản lý giỏ hàng của mình.</p>
            <button
              id="btn-cart-login"
              style="background:var(--orange,#F97316);color:#fff;border:none;padding:0.8rem 2rem;border-radius:8px;font-size:1rem;font-weight:700;cursor:pointer;"
            >🔑 Đăng nhập ngay</button>
            <br><br>
            <a href="index.html" style="color:#6b7280;font-size:0.9rem;">← Quay về trang chủ</a>
          </div>
        `;
        document.getElementById('btn-cart-login').addEventListener('click', () => {
          if (window.openAuthModal) {
            window.openAuthModal('login');
          } else {
            window.location.href = 'index.html';
          }
        });
        return;
      }
      renderCart();
    });
  </script>
  <script src="floating-contact.js"></script>
  <script src="fake-order-notification.js"></script>
</body>
</html>
